<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SKG – Study + Knowledge = Glory</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <span class="brand">SKG</span>
      <div class="topbar-actions">
        <button class="icon-btn" id="newChat" title="New chat">New chat</button>
        <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">⚙</button>
      </div>
    </header>

    <!-- hero: shown until the first message is sent -->
    <div class="container" id="hero">
      <h6>SKG</h6>
      <h5>Study + Knowledge = Glory</h5>
      <h3>Ask questions. Solve your doubts. Be confident.</h3>
    </div>

    <div class="chat-container" id="chat" aria-live="polite"></div>

    <!-- input -->
    <form class="prompt-area" id="form" autocomplete="off">
      <input type="text" class="prompt" id="prompt" placeholder="Ask your doubt…" aria-label="Your question" />
      <button class="btn" id="send" type="submit">Send</button>
    </form>

    <!-- settings dialog (API key is stored only in this browser) -->
    <dialog id="settings">
      <form method="dialog" id="settingsForm">
        <h2>Settings</h2>
        <p>
          Paste your free Gemini API key from
          <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a>.
          It is saved only in this browser and sent only to Google.
        </p>
        <label>API key
          <input type="password" id="keyInput" placeholder="AIza…" />
        </label>
        <label>Model
          <select id="modelSelect">
            <option value="gemini-2.5-flash">gemini-2.5-flash (recommended)</option>
            <option value="gemini-2.5-flash-lite">gemini-2.5-flash-lite (faster)</option>
            <option value="gemini-2.5-pro">gemini-2.5-pro (smarter)</option>
          </select>
        </label>
        <div class="dialog-actions">
          <button value="cancel" class="secondary">Cancel</button>
          <button value="save" id="saveSettings">Save</button>
        </div>
      </form>
    </dialog>

    <script src="./app.js"></script>
  </body>
</html>
